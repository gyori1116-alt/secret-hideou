<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀 아지트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
  <style>
    :root {
      --pink: #ff8fab;
      --cream: #fff7ec;
      --ink: #4a3b5c;
      --panel: rgba(255, 247, 236, 0.92);
      --font: 'Galmuri11', 'Malgun Gothic', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2f6b3a; font-family: var(--font); color: var(--ink); }
    canvas#game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }

    /* 입장 화면 */
    #join {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: rgba(47, 107, 58, 0.75); backdrop-filter: blur(3px); z-index: 10;
    }
    #join form {
      background: var(--cream); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
      padding: 24px 28px; width: min(360px, calc(100vw - 32px)); display: grid; gap: 12px;
    }
    #join h1 { margin: 0; font-size: 22px; text-align: center; }
    #join p.sub { margin: 0; font-size: 12px; text-align: center; opacity: .7; }
    #join label { font-size: 13px; display: grid; gap: 4px; }
    #join input[type=text], #join input[type=password] {
      font: inherit; padding: 8px 10px; border: 3px solid var(--ink); background: #fff; outline: none;
    }
    #join input:focus { border-color: var(--pink); }
    .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
    .swatches button {
      width: 30px; height: 30px; border: 3px solid var(--ink); cursor: pointer; padding: 0;
    }
    .swatches button.on { outline: 3px solid var(--pink); outline-offset: 2px; }
    #join .go {
      font: inherit; font-size: 16px; padding: 10px; border: 3px solid var(--ink); background: var(--pink);
      color: #fff; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); text-shadow: 1px 1px 0 var(--ink);
    }
    #join .go:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    #joinMsg { min-height: 16px; font-size: 12px; color: #d64545; text-align: center; margin: 0; }

    /* 화면 UI */
    .panel { position: fixed; background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
    #help { top: 12px; left: 12px; padding: 6px 10px; font-size: 12px; }
    #who { top: 12px; right: 12px; padding: 8px 12px; font-size: 12px; min-width: 120px; }
    #who b { display: block; margin-bottom: 4px; }
    #who ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
    #who li::before { content: '● '; color: var(--c); }
    #chat { left: 12px; bottom: 12px; width: min(360px, calc(100vw - 24px)); display: flex; flex-direction: column; }
    #log { height: 170px; overflow-y: auto; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
    #log .sys { opacity: .6; font-size: 12px; }
    #log .nm { font-weight: bold; }
    #log .tm { opacity: .45; font-size: 10px; margin-left: 4px; }
    #chatForm { display: flex; border-top: 3px solid var(--ink); }
    #chatInput { flex: 1; font: inherit; font-size: 13px; padding: 8px 10px; border: 0; outline: none; background: #fff; min-width: 0; }
    #chatForm button { font: inherit; border: 0; border-left: 3px solid var(--ink); background: var(--pink); color: #fff; padding: 0 12px; cursor: pointer; }
    #status { bottom: 12px; right: 12px; padding: 6px 10px; font-size: 12px; display: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="help" class="panel hidden">⌨️ WASD / 방향키 이동 · Enter 채팅</div>
  <div id="who" class="panel hidden"><b>접속 중 0명</b><ul></ul></div>
  <div id="chat" class="panel hidden">
    <div id="log"></div>
    <form id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="200" placeholder="Enter 눌러서 말하기..." />
      <button type="submit">전송</button>
    </form>
  </div>
  <div id="status" class="panel">연결이 끊겼어요... 다시 연결 중 🔄</div>

  <div id="join">
    <form id="joinForm" autocomplete="off">
      <h1>🏠 비밀 아지트</h1>
      <p class="sub">우리끼리만 아는 작은 공간</p>
      <label>내 이름
        <input type="text" id="nameInput" maxlength="12" placeholder="예: 동생" required />
      </label>
      <label>옷 색깔
        <div class="swatches" id="swatches"></div>
      </label>
      <label>비밀 코드 <span style="opacity:.6">(설정된 경우에만)</span>
        <input type="password" id="codeInput" maxlength="40" />
      </label>
      <button class="go" type="submit">입장하기 ✨</button>
      <p id="joinMsg"></p>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
